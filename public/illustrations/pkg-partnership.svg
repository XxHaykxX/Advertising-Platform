<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Partnership: the handshake. Everything sits in one rotated frame so the
       two arms share a diagonal, and is drawn back-to-front (arms, far hand,
       near hand's fingers, thumb) with plate fills — each shape hides the one
       behind it instead of crossing it. The fingers are SHORT and set at ~35°
       to the arm: spanning the clasp end to end (tried first) reads as a stack
       of bars, not as a grip. The accented cuff is the brand's side. -->
  <rect width="320" height="180" fill="#f4f5fa"/>
  <g transform="rotate(-15 160 92)" fill="#f4f5fa" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-70" y="74" width="204" height="36" rx="18"/>
    <rect x="186" y="74" width="160" height="36" rx="18"/>
    <!-- the far hand -->
    <rect x="108" y="60" width="94" height="62" rx="24"/>
    <!-- the near hand: four fingers curled across it, and the thumb above -->
    <rect x="130" y="82" width="14" height="42" rx="7" transform="rotate(-35 137 103)"/>
    <rect x="148" y="84" width="14" height="42" rx="7" transform="rotate(-35 155 105)"/>
    <rect x="166" y="84" width="14" height="42" rx="7" transform="rotate(-35 173 105)"/>
    <rect x="184" y="82" width="14" height="42" rx="7" transform="rotate(-35 191 103)"/>
    <rect x="120" y="54" width="76" height="21" rx="10.5" transform="rotate(-8 158 64)"/>
    <!-- cuffs -->
    <rect x="36" y="74" width="28" height="36" fill="#4f46e5" fill-opacity="0.1" stroke="#4f46e5"/>
    <line x1="286" y1="74" x2="286" y2="110"/>
  </g>
</svg>
