<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Premiere tickets: two stubs, the front one the sponsor's. Palette from
       src/app/globals.css (#111827 / #6b7280 / #4f46e5). No text anywhere —
       the card prints the package name itself, in whichever language. -->
  <rect width="320" height="180" fill="#f4f5fa"/>
  <!-- back ticket -->
  <g transform="rotate(-9 132 74)">
    <path d="M74 44 h72 a7 7 0 0 0 14 0 h30 a6 6 0 0 1 6 6 v52 a6 6 0 0 1 -6 6 h-30 a7 7 0 0 0 -14 0 h-72 a6 6 0 0 1 -6 -6 v-52 a6 6 0 0 1 6 -6 Z"
          fill="#f4f5fa" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round"/>
    <line x1="153" y1="52" x2="153" y2="100" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.8"/>
  </g>
  <!-- front ticket -->
  <g transform="rotate(7 168 112)">
    <path d="M96 78 h72 a7 7 0 0 0 14 0 h30 a6 6 0 0 1 6 6 v52 a6 6 0 0 1 -6 6 h-30 a7 7 0 0 0 -14 0 h-72 a6 6 0 0 1 -6 -6 v-52 a6 6 0 0 1 6 -6 Z"
          fill="#f4f5fa" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <line x1="175" y1="86" x2="175" y2="134" stroke="#111827" stroke-width="2" stroke-dasharray="4 6"/>
    <path d="M118 100 l10 10 -10 10 -10 -10 Z" fill="#4f46e5" fill-opacity="0.18" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round"/>
    <rect x="138" y="99" width="30" height="7" rx="3.5" fill="#6b7280"/>
    <rect x="138" y="114" width="20" height="7" rx="3.5" fill="#6b7280" opacity="0.55"/>
    <rect x="184" y="99" width="18" height="7" rx="3.5" fill="#4f46e5" opacity="0.85"/>
    <rect x="184" y="114" width="12" height="7" rx="3.5" fill="#6b7280" opacity="0.45"/>
  </g>
</svg>
