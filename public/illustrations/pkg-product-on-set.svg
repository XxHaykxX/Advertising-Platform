<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- A product on set: key light, plinth, can. Palette from src/app/globals.css
       (foreground #111827, muted-foreground #6b7280, primary #4f46e5). -->
  <rect width="320" height="180" fill="#f4f5fa"/>
  <g fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="34" y1="146" x2="286" y2="146"/>
    <!-- bounce board on a stand, far side -->
    <path d="M232 54 L268 62 L262 90 L226 82 Z"/>
    <line x1="247" y1="86" x2="247" y2="144"/>
    <line x1="238" y1="150" x2="256" y2="150"/>
    <!-- light spill toward the product -->
    <g opacity="0.55">
      <line x1="100" y1="66" x2="146" y2="80"/>
      <line x1="100" y1="78" x2="146" y2="96"/>
    </g>
  </g>
  <g fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- plinth -->
    <rect x="130" y="120" width="80" height="26" rx="3"/>
    <!-- key light: softbox on a stand -->
    <path d="M52 58 L90 50 L94 78 L56 86 Z"/>
    <line x1="75" y1="83" x2="75" y2="140"/>
    <line x1="75" y1="140" x2="59" y2="152"/>
    <line x1="75" y1="140" x2="91" y2="152"/>
    <line x1="75" y1="140" x2="75" y2="152"/>
  </g>
  <!-- the product itself, the one accented thing -->
  <g fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M158 82 v34 a12 4 0 0 0 24 0 v-34" fill="#4f46e5" fill-opacity="0.08"/>
    <ellipse cx="170" cy="82" rx="12" ry="4" fill="#f4f5fa"/>
    <line x1="158" y1="98" x2="182" y2="98" opacity="0.6"/>
  </g>
</svg>
