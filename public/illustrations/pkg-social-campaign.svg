<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Social campaign: the post and the reactions it collects. -->
  <rect width="320" height="180" fill="#f4f5fa"/>
  <g fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="86" y="22" width="86" height="140" rx="12" fill="#f4f5fa"/>
    <line x1="118" y1="32" x2="140" y2="32"/>
  </g>
  <!-- what is on the screen: an image, two lines, a like -->
  <rect x="96" y="44" width="66" height="42" rx="4" fill="#6b7280" fill-opacity="0.14" stroke="#6b7280" stroke-width="1.6"/>
  <g fill="#6b7280">
    <rect x="96" y="96" width="66" height="6" rx="3" opacity="0.75"/>
    <rect x="96" y="108" width="44" height="6" rx="3" opacity="0.5"/>
  </g>
  <path d="M104 132 a7 7 0 0 1 12 -5 a7 7 0 0 1 12 5 c0 8 -12 14 -12 14 s-12 -6 -12 -14 Z"
        fill="#4f46e5" fill-opacity="0.15" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round"/>
  <!-- reactions coming back -->
  <g fill="#f4f5fa" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round">
    <path d="M204 34 h68 a10 10 0 0 1 10 10 v26 a10 10 0 0 1 -10 10 h-46 l-14 12 v-12 h-8 a10 10 0 0 1 -10 -10 v-26 a10 10 0 0 1 10 -10 Z"/>
    <path d="M228 48 a8 8 0 0 1 14 -5 a8 8 0 0 1 14 5 c0 9 -14 16 -14 16 s-14 -7 -14 -16 Z" fill="#4f46e5" fill-opacity="0.15"/>
  </g>
  <g fill="#f4f5fa" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round">
    <path d="M212 104 h56 a9 9 0 0 1 9 9 v20 a9 9 0 0 1 -9 9 h-38 l-12 10 v-10 h-6 a9 9 0 0 1 -9 -9 v-20 a9 9 0 0 1 9 -9 Z"/>
  </g>
  <g fill="#6b7280">
    <circle cx="230" cy="123" r="3.5"/>
    <circle cx="243" cy="123" r="3.5"/>
    <circle cx="256" cy="123" r="3.5"/>
