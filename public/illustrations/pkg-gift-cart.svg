  <line x1="36" y1="158" x2="284" y2="158" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round"/>
  <g transform="translate(-24 0)">
    <g fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- hand truck -->
      <line x1="196" y1="40" x2="222" y2="40"/>
      <line x1="204" y1="40" x2="204" y2="146"/>
      <line x1="214" y1="40" x2="214" y2="146"/>
      <line x1="204" y1="146" x2="146" y2="146"/>
      <line x1="146" y1="146" x2="142" y2="140"/>
      <circle cx="209" cy="147" r="11"/>
