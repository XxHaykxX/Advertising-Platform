  <g fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <rect x="222" y="122" width="46" height="36" rx="3"/>
    <line x1="240" y1="122" x2="240" y2="158"/>
