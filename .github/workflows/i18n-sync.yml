name: i18n sync — pull translations from Google Sheet

# Manual only: the owner clicks "Run workflow" after the content writer has
# finished editing the sheet. No schedule/cron — intentionally on-demand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-translations:
    name: Import sheet → src/lib/i18n.ts, verify, commit & push
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import translations from the Google Sheet
        run: npm run i18n:import
        env:
          I18N_SHEET_CSV_URL: ${{ secrets.I18N_SHEET_CSV_URL }}

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Commit and push if translations changed
        run: |
          if git status --porcelain | grep -q "src/lib/i18n.ts"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/lib/i18n.ts
            git commit -m "chore(i18n): sync translations from Google Sheet"
            git push
          else
            echo "no changes — sheet already matches src/lib/i18n.ts"
          fi
