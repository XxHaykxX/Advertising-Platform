# Builds the container and rolls the ECS service.
#
# MANUAL ONLY for now (workflow_dispatch). Hostinger's git auto-deploy is still
# the live path, and until the DNS cutover this workflow must not run itself on
# every push — including the pushes the in-admin translation editor makes to
# `main` through the GitHub Contents API. At cutover, add:
#
#   push:
#     branches: [main]
#
# and remove the Hostinger deploy.
name: Deploy to AWS (Fargate)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-aws-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  # OIDC to AWS — no long-lived access keys stored in GitHub.
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # GitHub's hosted runners are x86, so building the ARM64 image below needs
      # an emulator registered first. Measured locally: it costs roughly three
      # minutes on the `next build` step, which is the price of the ~20% Fargate
      # discount. Swap both this and `platforms` out if the deploy ever moves to
      # an ARM64 runner.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 🔴 This MUST match the ECS task definition's runtimePlatform. They
          # are set in two different places by two different people, and a
          # mismatch is not a subtle failure — the task never starts, with an
          # exec-format error that reads like a corrupt image. `message for
          # Adam.md` asks for ARM64/Graviton on the task definition; if that
          # request was not honoured, change this line rather than leaving them
          # disagreeing.
          platforms: linux/arm64
          # Two tags on purpose: the immutable one identifies exactly what ran,
          # the environment one is what the ECS task definition points at (see
          # the rollback note below).
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ inputs.environment }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_MEDIA_ORIGIN=${{ vars.NEXT_PUBLIC_MEDIA_ORIGIN }}
          # No database credentials here — the build only needs DATABASE_URL to
          # be *defined*, never reachable, so the Dockerfile sets a placeholder.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll the service
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"

      - name: Smoke test
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null "${{ vars.HEALTH_URL }}"; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "health check never came up" >&2
          exit 1

# ROLLBACK
#
# The task definition points at the mutable `:prod` / `:dev` tag, so rolling
# back is re-tagging, not redeploying:
#
#   MANIFEST=$(aws ecr batch-get-image --repository-name "$REPO" \
#     --image-ids imageTag=<good-sha> --query 'images[0].imageManifest' --output text)
#   aws ecr put-image --repository-name "$REPO" --image-tag prod --image-manifest "$MANIFEST"
#   aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment
#
# Cost of that choice: the task definition alone doesn't tell you which commit
# is live. `aws ecs describe-tasks` gives the image digest, and the `:<sha>` tag
# maps it back.
#
# REQUIRED CONFIGURATION
#
# Repository variables: ECR_REPOSITORY, ECS_CLUSTER, ECS_SERVICE,
#   NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_MEDIA_ORIGIN, HEALTH_URL   (per environment: dev / prod)
# Secrets: AWS_DEPLOY_ROLE_ARN
